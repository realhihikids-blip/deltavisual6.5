name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PROJECT_DIR: delta-visuals-0_7_0-root

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delta-visuals-0_7_0-root
    steps:
      - uses: actions/checkout@v4

      - name: Check project folder
        run: |
          pwd
          ls -la
          test -f build.gradle && test -f settings.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
          build-root-directory: delta-visuals-0_7_0-root

      # gradlew in this project is a minimal launcher: it needs gradle-wrapper.jar, which is not committed.
      - name: Create Gradle wrapper if missing
        if: ${{ hashFiles('delta-visuals-0_7_0-root/gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: gradle wrapper --gradle-version 9.2.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: List result
        run: ls -l build/libs

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: delta-visuals-jar
          path: |
            delta-visuals-0_7_0-root/build/libs/*.jar
            !delta-visuals-0_7_0-root/build/libs/*-sources.jar
            !delta-visuals-0_7_0-root/build/libs/*-dev.jar
          if-no-files-found: error
